# Релиз на тег vX.Y.Z: self-contained publish -> Velopack pack -> GitHub Release.
# Для публикации используется временный GITHUB_TOKEN самого workflow; пользовательские токены
# приложению не нужны, потому что релизы читаются из публичного репозитория.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия X.Y.Z (без v)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ github.ref_name }}".TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version: $v"

      - name: Resolve release notes
        id: notes
        shell: pwsh
        run: |
          $path = ".github/release-notes/v${{ steps.ver.outputs.version }}.md"
          if (-not (Test-Path -LiteralPath $path)) {
            throw "Release notes not found: $path"
          }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Test
        run: dotnet test StudComp.slnx --configuration Release --verbosity minimal

      - name: Publish (self-contained, R2R)
        run: >
          dotnet publish src/StudComp.App/StudComp.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o artifacts/publish

      - name: Download previous releases (for delta)
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ github.token }}
          --outputDir artifacts/releases

      - name: Pack
        run: >
          vpk pack
          --packId Rubrica
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir artifacts/publish
          --mainExe Rubrica.exe
          --packTitle Rubrica
          --packAuthors LynxSir
          --runtime win-x64
          --releaseNotes ${{ steps.notes.outputs.path }}
          --icon src/StudComp.App/Resources/Branding/Rubrica.ico
          --outputDir artifacts/releases

      - name: Upload GitHub Release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ github.token }}
          --publish
          --releaseName "Rubrica ${{ steps.ver.outputs.version }}"
          --tag v${{ steps.ver.outputs.version }}
          --outputDir artifacts/releases

      - name: Keep only user and updater assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.ver.outputs.version }}`;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const hiddenBuildFiles = new Set([
              'RELEASES',
              'assets.win.json',
            ]);
            for (const asset of release.assets) {
              if (hiddenBuildFiles.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rubrica-${{ steps.ver.outputs.version }}
          path: |
            artifacts/releases/Rubrica-win-Setup.exe
            artifacts/releases/Rubrica-win-Portable.zip
            artifacts/releases/Rubrica-*-full.nupkg
            artifacts/releases/Rubrica-*-delta.nupkg
            artifacts/releases/releases.win.json
